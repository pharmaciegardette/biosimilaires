<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biosimilaires — Référentiel Pharmacien</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f3ee;
    --surface: #ffffff;
    --surface2: #faf9f6;
    --border: #e2ddd6;
    --accent: #2d5a8e;
    --accent2: #c4783a;
    --accent3: #3a8e6e;
    --danger: #c0392b;
    --warn: #d68910;
    --text: #1a1714;
    --text2: #5a5550;
    --text3: #8a847e;
    --tag-bg: #edf2f8;
    --tag-text: #2d5a8e;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* HEADER */
  header {
    background: var(--accent);
    color: white;
    padding: 32px 40px 28px;
    position: relative;
    overflow: hidden;
  }
  header::before {
    content: '';
    position: absolute;
    right: -60px; top: -60px;
    width: 280px; height: 280px;
    background: rgba(255,255,255,0.06);
    border-radius: 50%;
  }
  header::after {
    content: '';
    position: absolute;
    right: 80px; bottom: -80px;
    width: 200px; height: 200px;
    background: rgba(255,255,255,0.04);
    border-radius: 50%;
  }
  .header-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.65);
    margin-bottom: 10px;
  }
  header h1 {
    font-family: 'Playfair Display', serif;
    font-size: 32px;
    font-weight: 700;
    line-height: 1.2;
    margin-bottom: 8px;
  }
  header p {
    font-size: 14px;
    color: rgba(255,255,255,0.72);
    font-weight: 300;
  }
  .header-meta {
    margin-top: 20px;
    display: flex;
    gap: 24px;
    flex-wrap: wrap;
  }
  .meta-pill {
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 20px;
    padding: 5px 14px;
    font-size: 12px;
    color: rgba(255,255,255,0.85);
    font-weight: 500;
  }

  /* SEARCH + FILTER */
  .controls {
    padding: 24px 40px;
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
  }
  .search-wrap {
    position: relative;
    flex: 1;
    min-width: 200px;
    max-width: 360px;
  }
  .search-wrap svg {
    position: absolute;
    left: 12px; top: 50%;
    transform: translateY(-50%);
    color: var(--text3);
  }
  input[type="search"] {
    width: 100%;
    padding: 9px 12px 9px 38px;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    background: var(--bg);
    color: var(--text);
    outline: none;
    transition: border-color 0.2s;
  }
  input[type="search"]:focus { border-color: var(--accent); }

  .filter-btn {
    padding: 8px 16px;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    background: white;
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    color: var(--text2);
    transition: all 0.2s;
  }
  .filter-btn:hover, .filter-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
  }
  .results-count {
    margin-left: auto;
    font-size: 12px;
    color: var(--text3);
    font-weight: 500;
  }

  /* MAIN */
  main {
    padding: 32px 40px;
    display: grid;
    gap: 20px;
  }

  /* CARD */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    transition: box-shadow 0.25s, transform 0.25s;
    animation: fadeUp 0.4s ease both;
  }
  .card:hover {
    box-shadow: 0 8px 32px rgba(45,90,142,0.1);
    transform: translateY(-2px);
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .card-header {
    display: flex;
    align-items: flex-start;
    gap: 16px;
    padding: 20px 24px 16px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    user-select: none;
  }
  .group-badge {
    background: var(--accent);
    color: white;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    padding: 4px 10px;
    border-radius: 20px;
    white-space: nowrap;
    margin-top: 2px;
    flex-shrink: 0;
  }
  .card-title-wrap { flex: 1; }
  .molecule-name {
    font-family: 'Playfair Display', serif;
    font-size: 20px;
    font-weight: 700;
    color: var(--text);
    line-height: 1.2;
  }
  .reference-name {
    font-size: 13px;
    color: var(--text3);
    margin-top: 3px;
  }
  .reference-name span {
    font-weight: 600;
    color: var(--accent2);
  }
  .biosimilars-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 10px;
  }
  .chip {
    background: var(--tag-bg);
    color: var(--tag-text);
    font-size: 11px;
    font-weight: 500;
    padding: 3px 10px;
    border-radius: 20px;
    border: 1px solid #d0dff0;
  }
  .chevron {
    color: var(--text3);
    transition: transform 0.3s;
    flex-shrink: 0;
    margin-top: 4px;
  }
  .card.open .chevron { transform: rotate(180deg); }

  /* EXPANDABLE BODY */
  .card-body {
    display: none;
    padding: 0;
  }
  .card.open .card-body { display: block; }

  .info-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 0;
    border-top: none;
  }

  .info-section {
    padding: 20px 24px;
    border-right: 1px solid var(--border);
  }
  .info-section:last-child { border-right: none; }

  .section-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .section-label .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .indic-label { color: var(--accent3); }
  .indic-label .dot { background: var(--accent3); }
  .ei-label { color: var(--danger); }
  .ei-label .dot { background: var(--danger); }
  .precaution-label { color: var(--accent2); }
  .precaution-label .dot { background: var(--accent2); }

  ul.info-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  ul.info-list li {
    font-size: 12.5px;
    color: var(--text2);
    line-height: 1.5;
    padding-left: 14px;
    position: relative;
  }
  ul.info-list li::before {
    content: '—';
    position: absolute;
    left: 0;
    color: var(--border);
    font-size: 11px;
  }

  /* SPECIFIC CONDITIONS BANNER */
  .conditions-banner {
    background: #fdf8f3;
    border-top: 1px solid var(--border);
    padding: 14px 24px;
  }
  .conditions-banner-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--accent2);
    margin-bottom: 8px;
  }
  .conditions-list {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .cond-tag {
    background: white;
    border: 1px solid #e8d5c0;
    border-radius: 6px;
    padding: 5px 10px;
    font-size: 11.5px;
    color: #7a4f28;
    line-height: 1.4;
  }

  /* SANDOZ HIGHLIGHT */
  .chip.sandoz {
    background: linear-gradient(135deg, #e8f4fd, #d0eaf8);
    color: #1a5c8a;
    border: 1.5px solid #4da3d4;
    font-weight: 700;
    position: relative;
    padding-right: 28px;
  }
  .chip.sandoz::after {
    content: 'S';
    position: absolute;
    right: 7px;
    top: 50%;
    transform: translateY(-50%);
    background: #1a5c8a;
    color: white;
    font-size: 9px;
    font-weight: 800;
    width: 14px; height: 14px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 14px;
    text-align: center;
  }

  .sandoz-legend {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: #e8f4fd;
    border: 1.5px solid #4da3d4;
    border-radius: 8px;
    padding: 6px 14px;
    font-size: 12px;
    color: #1a5c8a;
    font-weight: 600;
  }
  .sandoz-legend .chip.sandoz { font-size: 11px; padding: 2px 22px 2px 8px; }

  .hidden { display: none !important; }

  @media (max-width: 768px) {
    header, .controls, main { padding-left: 20px; padding-right: 20px; }
    .info-grid { grid-template-columns: 1fr; }
    .info-section { border-right: none; border-bottom: 1px solid var(--border); }
    .info-section:last-child { border-bottom: none; }
    header h1 { font-size: 24px; }
  }
</style>
</head>

function renderCards(items) {
  const container = document.getElementById('cardContainer');
  container.innerHTML = '';
  document.getElementById('resultsCount').textContent = `${items.length} groupe${items.length > 1 ? 's' : ''} affiché${items.length > 1 ? 's' : ''}`;

  items.forEach((d, idx) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.style.animationDelay = `${idx * 0.04}s`;
    card.dataset.tags = d.tags.join(',');
    card.dataset.searchable = (d.molecule + ' ' + d.reference + ' ' + d.biosimilars.join(' ')).toLowerCase();

    const conditionsHTML = d.conditions.length ? `
      <div class="conditions-banner">
        <div class="conditions-banner-label">⚙️ Conditions spécifiques de substitution</div>
        <div class="conditions-list">
          ${d.conditions.map(c => `<span class="cond-tag">${c}</span>`).join('')}
        </div>
      </div>` : '';

    card.innerHTML = `
      <div class="card-header" onclick="toggleCard(this)">
        <span class="group-badge">Groupe ${d.group}</span>
        <div class="card-title-wrap">
          <div class="molecule-name">${d.molecule}</div>
          <div class="reference-name">Référence : <span>${d.reference}</span></div>
          <div class="biosimilars-chips">
            ${d.biosimilars.map(b => `<span class="chip${SANDOZ.has(b) ? ' sandoz' : ''}">${b}</span>`).join('')}
          </div>
        </div>
        <svg class="chevron" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
      </div>
      <div class="card-body">
        <div class="info-grid">
          <div class="info-section">
            <div class="section-label indic-label"><span class="dot"></span>Indications thérapeutiques</div>
            <ul class="info-list">${d.indications.map(i => `<li>${i}</li>`).join('')}</ul>
          </div>
          <div class="info-section">
            <div class="section-label ei-label"><span class="dot"></span>Effets indésirables fréquents</div>
            <ul class="info-list">${d.sideEffects.map(e => `<li>${e}</li>`).join('')}</ul>
          </div>
          <div class="info-section">
            <div class="section-label precaution-label"><span class="dot"></span>Conseils pharmacien au patient</div>
            <ul class="info-list">${d.pharmacistAdvice.map(p => `<li>${p}</li>`).join('')}</ul>
          </div>
        </div>
        ${conditionsHTML}
      </div>`;
    container.appendChild(card);
  });
}

function toggleCard(header) {
  const card = header.parentElement;
  card.classList.toggle('open');
}

let activeTag = null;

function filterAll(btn) {
  activeTag = null;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  filterCards();
}

function filterGroup(tag, btn) {
  activeTag = tag;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  filterCards();
}

function filterCards() {
  const query = document.getElementById('searchInput').value.toLowerCase();
  let filtered = data;
  if (activeTag) filtered = filtered.filter(d => d.tags.includes(activeTag));
  if (query) filtered = filtered.filter(d =>
    (d.molecule + ' ' + d.reference + ' ' + d.biosimilars.join(' ')).toLowerCase().includes(query)
  );
  renderCards(filtered);
}

// Initial render
renderCards(data);
